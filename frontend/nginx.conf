# /nginx.conf

server {
    # Escucha en el puerto 80
    listen 80;
    # listen [::]:80; # Descomentar para IPv6 si es necesario

    # Establece el directorio raíz donde están los archivos estáticos
    root /usr/share/nginx/html;

    # Archivo índice principal
    index index.html index.htm;

    # Configuración crucial para Single Page Applications (SPA) como Vue
    location / {
        # Primero intenta servir el archivo solicitado ($uri)
        # Luego intenta servir el directorio solicitado ($uri/)
        # Si ninguno existe, sirve /index.html (para que Vue Router maneje la ruta)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Configuración para compresión Gzip (mejora el rendimiento)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Opcional: Cachear assets estáticos por un largo tiempo
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off; # No loguear accesos a assets estáticos (opcional)
    }

    # Opcional: Denegar acceso a archivos ocultos (como .git, .env)
    location ~ /\. {
        deny all;
    }

    # Opcional: Páginas de error personalizadas (si las tienes)
    # error_page 404 /404.html;
    # location = /404.html {
    #     internal;
    # }
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     internal;
    # }
}